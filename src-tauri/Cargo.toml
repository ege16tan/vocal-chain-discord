[package]
name = "vocal-chain-discord"
version = "0.1.0"
description = "Offline WAV harness and Discord vocal processing"
authors = ["you"]
edition = "2021"

[lib]
name = "vocal_chain_discord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ebur128 = "0.1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
